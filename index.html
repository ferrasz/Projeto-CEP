<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Felipe Ferraz">
    <meta name="description" content="aprimorar meus conhecimentos em desenvolvimento front-end">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <title>CEP</title>
    <link rel="stylesheet" href="./src/style/style.css">

</head>
<body>
    <header>
        <img src="./src/assets/images/logo.svg" alt="logo da empresa">
        <nav>
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">Produtos</a></li>
                <li><a href="">Sobre-nós</a></li>
                <li><a href="">Contato</a></li>
            </ul>
        </nav>
        <a href="" class="btn-header">Login</a>
    </header>

    <main>
        <div>
            <img src="./src/assets/images/foto-not.svg" alt="foto de um notebook">
        </div>
        <div class="container-main">
            <div class="reviews">
                <img src="./src/assets/images/icone-estrela.svg" alt="icone de uma estrela amarela">
                <img src="./src/assets/images/icone-estrela.svg" alt="icone de uma estrela amarela">
                <img src="./src/assets/images/icone-estrela.svg" alt="icone de uma estrela amarela">
                <img src="./src/assets/images/icone-estrela.svg" alt="icone de uma estrela amarela">
                <img src="./src/assets/images/icone-estrela.svg" alt="icone de uma estrela amarela">

                <p>5.0 Estrelas</p>

                <span>(21.671 avaliações)</span>
            </div>

            <p>2020 Apple MacBook Pro with Apple M1 Chip (13-inch, 8GB RAM, 256GB SSD Storage) - Space Gray</p>

            <div class="product-prices">
                <p>R$5.299,00</p>
                <span id="span">R$7.000,00</span>
                <span id="span2">24,3% OFF</span>
            </div>

            <div class="click">
                <p>Cor</p><br>
                <input type="radio">
                <input type="radio">
            </div>

            <button>Adicionar no carrinho</button>

        </div>
    </main>

    <section>
        <h1>Informações</h1>
        <form class="container-informations">
            <div class="input-group">
                <label for="">Nome completo:</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label for="">CPF:</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label for="">CEP:</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label for="">Rua:</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label for="">Número:</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label for="">Complemento:</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label for="">Estado:</label>
                <input type="text">
            </div>
            <div class="input-group">
                <label for="">Bairro:</label>
                <input type="text">
            </div>
        </form>
        
        <button>Enviar</button>

    </section>
</body>
</html>
